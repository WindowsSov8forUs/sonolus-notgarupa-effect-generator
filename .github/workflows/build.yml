name: Build

# Tests, then cross-compiles the command for every OS × architecture in the
# matrix and uploads one archive per target. A v* tag additionally publishes
# the archives and their checksums as a GitHub Release.
#
# To cut a release:
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  NAME: sonolus-notgarupa-effect-generator

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...

  build:
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          arch="$GOARCH"; [ "$arch" = amd64 ] && arch="x86_64"
          archive="${NAME}_${version#v}_${GOOS}_${arch}"
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/pkg/$NAME$ext" "./cmd/$NAME"
          cp README.md dist/pkg/
          if [ "$GOOS" = windows ]; then
            (cd dist/pkg && zip -q "../$archive.zip" ./*)
          else
            tar -czf "dist/$archive.tar.gz" -C dist/pkg .
          fi
          rm -r dist/pkg
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          {
            echo "### 安装"
            echo
            echo "下载对应平台的压缩包，解压后把 \`$NAME\` 放到 PATH 中即可，\`$NAME -h\` 查看全部参数（压缩包内附 README）。"
            echo "程序已内置所需的 APK 资源，其余素材运行时联网下载到 \`.cache/\`。"
          } > ../notes.md
          prerelease=""; [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file ../notes.md --generate-notes $prerelease
